name: g1care
description: "G1Care - Smart Emergency Medical Identification & Response System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  
  # State Management
  provider: ^6.1.2

  # Firebase Services
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # Utility & Storage
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  intl: ^0.19.0
  crypto: ^3.0.6

  # QR Code System
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # Map & Location & Routing (Milestone 4 - Free/OpenStreetMap, No Paid APIs)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.2
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

